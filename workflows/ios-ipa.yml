name: iOS .ipa Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Set API key env
        run: echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" >> $GITHUB_ENV

      - name: Create keychain and import certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain"
          security create-keychain -p "pass" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "pass" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" "login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.APPLE_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > profile.mobileprovision
          uuid=$(grep -a -o '[-A-F0-9]\{36\}' profile.mobileprovision | head -n 1)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

      - name: Build and Archive
        run: |
          xcodebuild -scheme WeatherApp \
            -configuration Release \
            -archivePath build/WeatherApp.xcarchive \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            archive | xcpretty

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/WeatherApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist WeatherApp/exportOptions.plist \
            -allowProvisioningUpdates | xcpretty
          ls -la build/ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherApp-ipa
          path: build/ipa/*.ipa